<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | NEXO 3.9</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body class="login-page">
  <main class="login-container">
    <h1>NEXO <strong>3.9</strong></h1>
    <p class="descricao">Faça login para continuar</p>
    <!-- <p class="login-aviso">Modo de demonstração: não há validação de credenciais.</p> -->

    <form id="loginForm">
      <label for="email">E-mail ou usuário</label>
      <input type="text" id="email" name="email" placeholder="Seu e-mail ou usuário" autocomplete="username" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>

      <button type="submit">Entrar</button>
    </form>
  </main>
</body>

</html>
